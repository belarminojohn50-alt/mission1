<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Detectives: Mission 1 - Hear the Clues</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            DEFAULT: '#172A3A',
                            dark: '#0f1c27',
                            light: '#223c52'

                        ivory: {
                            DEFAULT: '#F7F4ED',
                            dark: '#e8e2d5'

                        gold: {
                            DEFAULT: '#C6A15B',
                            light: '#d8ba7f',
                            dark: '#a8833e'
                        },
                        slate: {
                            DEFAULT: '#52616B',
                            light: '#728491'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Styles for Interactive Polish & Accessibility */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #172A3A;
            color: #F7F4ED;
            user-select: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #C6A15B;
            border-radius: 4px;
        }

        .highlight-selectable {
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .highlight-selectable:hover {
            background-color: rgba(198, 161, 91, 0.3);
        }
        .highlight-selected {
            background-color: #C6A15B !important;
            color: #172A3A !important;
            font-weight: bold;
        }

        .badge-locked {
            filter: grayscale(100%) opacity(40%);
        }

        /* Focus outline for accessibility */
        button:focus-visible, [tabindex="0"]:focus-visible {
            outline: 3px solid #C6A15B;
            outline-offset: 2px;
        }

        .pulse-gold {
            animation: pulse-gold-anim 2s infinite;
        }
        @keyframes pulse-gold-anim {
            0% { box-shadow: 0 0 0 0 rgba(198, 161, 91, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(198, 161, 91, 0); }
            100% { box-shadow: 0 0 0 0 rgba(198, 161, 91, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-ivory antialiased selection:bg-gold selection:text-navy">

    <!-- Application Header -->
    <header class="bg-navy-dark border-b border-gold/20 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gold text-navy w-9 h-9 rounded-lg flex items-center justify-center font-bold text-lg shadow-md">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm md:text-base leading-tight text-ivory">Language Detectives</h1>
                    <p class="text-xs text-gold">Mission 1: Hear the Clues</p>
                </div>
            </div>

            <!-- Score & Audio Control Header Widget -->
            <div class="flex items-center gap-4">
                <button id="tts-btn" onclick="toggleAudio()" class="flex items-center gap-2 text-xs bg-navy-light hover:bg-slate px-3 py-1.5 rounded-full border border-gold/30 transition text-ivory" aria-label="Toggle Optional Read Aloud Audio">
                    <i id="tts-icon" class="fa-solid fa-volume-xmark text-gold"></i>
                    <span id="tts-text" class="hidden sm:inline">Audio Off</span>
                </button>

                <div id="score-display" class="hidden flex items-center gap-2 bg-navy-light px-3 py-1.5 rounded-full border border-gold/30">
                    <i class="fa-solid fa-star text-gold text-xs"></i>
                    <span class="text-xs font-semibold text-ivory">Score: <span id="current-score" class="text-gold font-bold">0</span>/150</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center my-auto">
        
        <!-- Global Progress Bar Container (Hidden on Screen 1 & 13) -->
        <div id="progress-container" class="hidden mb-6">
            <div class="flex justify-between items-center text-xs text-ivory/70 mb-2">
                <span id="screen-label" class="font-medium">Screen Progress</span>
                <span id="screen-count" class="text-gold font-semibold">1 / 13</span>
            </div>
            <div class="w-full bg-navy-light h-2 rounded-full overflow-hidden border border-gold/20">
                <div id="progress-bar" class="bg-gradient-to-r from-gold/80 to-gold h-full w-1/13 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Dynamic Screen Canvas Container -->
        <div id="app-canvas" class="bg-navy-dark/70 backdrop-blur-sm border border-gold/20 rounded-2xl p-6 md:p-8 shadow-2xl relative min-h-[460px] flex flex-col justify-between">
            <!-- Dynamic Content Injected Here by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-navy-dark border-t border-gold/10 py-3 px-4 text-center text-xs text-ivory/50">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <span>Grade 9 English</span>
            <span class="text-gold/80">Mission 1: Sound & Meaning Quest</span>
        </div>
    </footer>

    <script>
        /* State Management System */
        const state = {
            currentScreen: 1,
            score: 0,
            firstAttemptScore: 0,
            audioEnabled: false,
            speechSynth: window.speechSynthesis || null,
            
            // Progressive Reveal states for Concept Screens (Screens 4-7)
            conceptRevealStage: {
                4: 1, // 1: Def & Example, 2: How to Spot & Tip, 3: Checkpoint Question
                5: 1,
                6: 1,
                7: 1
            },

            // Screen Checkpoint States
            checkpoints: {
                4: { completed: false, attempt: 0, scoreEarned: 0, choice: null },
                5: { completed: false, attempt: 0, scoreEarned: 0, choice: null },
                6: { completed: false, attempt: 0, scoreEarned: 0, choice: null },
                7: { completed: false, attempt: 0, scoreEarned: 0, choice: null }
            },

            // Screen 9 Mixed Challenge State
            challenge: {
                currentIndex: 0,
                items: [
                    { id: 1, completed: false, attempt: 0, scoreEarned: 0, userChoice: null },
                    { id: 2, completed: false, attempt: 0, scoreEarned: 0, userChoice: null },
                    { id: 3, completed: false, attempt: 0, scoreEarned: 0, userChoice: null },
                    { id: 4, completed: false, attempt: 0, scoreEarned: 0, userChoice: null },
                    { id: 5, completed: false, attempt: 0, scoreEarned: 0, userChoice: null },
                    { id: 6, completed: false, attempt: 0, scoreEarned: 0, userChoice: null }
                ]
            },

            // Screen 11 Final Case Tasks State
            finalCase: {
                currentIndex: 0,
                tasks: [
                    { id: 1, type: 'highlight_pair', completed: false, attempt: 0, scoreEarned: 0, selected: [] },
                    { id: 2, type: 'drag_tap', completed: false, attempt: 0, scoreEarned: 0, value: null },
                    { id: 3, type: 'highlight_line', completed: false, attempt: 0, scoreEarned: 0, selectedIndex: null },
                    { id: 4, type: 'highlight_phrase', completed: false, attempt: 0, scoreEarned: 0, selectedIndex: null },
                    { id: 5, type: 'select_effect', completed: false, attempt: 0, scoreEarned: 0, choice: null }
                ]
            },

            // Earned Badges Tracking
            badges: {
                rhyme: false,
                repetition: false,
                alliteration: false,
                anaphora: false,
                sleuth: false,    // Completion Badge
                master: false     // Score >= 120
            }
        };

        function toggleAudio() {
            state.audioEnabled = !state.audioEnabled;
            const icon = document.getElementById('tts-icon');
            const text = document.getElementById('tts-text');

            if (state.audioEnabled) {
                icon.className = "fa-solid fa-volume-high text-gold";
                text.innerText = "Audio On";
                speakText("Audio read-aloud enabled.");
            } else {
                icon.className = "fa-solid fa-volume-xmark text-gold";
                text.innerText = "Audio Off";
                if (state.speechSynth) state.speechSynth.cancel();
            }
        }

        function speakText(text) {
            if (!state.audioEnabled || !state.speechSynth) return;
            state.speechSynth.cancel(); // Stop ongoing speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            state.speechSynth.speak(utterance);
        }

        function updateScore(points, isFirstAttempt) {
            state.score += points;
            if (isFirstAttempt) {
                state.firstAttemptScore += points;
            }
            document.getElementById('current-score').innerText = state.score;
        }

        function updateProgress() {
            const container = document.getElementById('progress-container');
            const scoreDisplay = document.getElementById('score-display');
            const bar = document.getElementById('progress-bar');
            const label = document.getElementById('screen-label');
            const count = document.getElementById('screen-count');

            if (state.currentScreen === 1 || state.currentScreen === 13) {
                container.classList.add('hidden');
            } else {
                container.classList.remove('hidden');
                scoreDisplay.classList.remove('hidden');
                bar.style.width = `${(state.currentScreen / 13) * 100}%`;
                count.innerText = `${state.currentScreen} / 13`;
                
                const titles = [
                    "", "Welcome", "Detective Briefing", "Warm-up Quest",
                    "Clue File 01: Rhyme", "Clue File 02: Repetition",
                    "Clue File 03: Alliteration", "Clue File 04: Anaphora",
                    "Comparison Board", "Six-Question Challenge",
                    "Final Case Poem", "Annotate Final Case",
                    "Case Debrief", "Mission Complete"
                ];
                label.innerText = titles[state.currentScreen] || "Mission Progress";
            }
        }

        function navigateTo(screenNumber) {
            if (screenNumber < 1 || screenNumber > 13) return;
            state.currentScreen = screenNumber;
            updateProgress();
            renderScreen();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderScreen() {
            const canvas = document.getElementById('app-canvas');
            canvas.innerHTML = '';

            switch(state.currentScreen) {
                case 1: renderScreen1(canvas); break;
                case 2: renderScreen2(canvas); break;
                case 3: renderScreen3(canvas); break;
                case 4: renderConceptScreen(canvas, 4); break;
                case 5: renderConceptScreen(canvas, 5); break;
                case 6: renderConceptScreen(canvas, 6); break;
                case 7: renderConceptScreen(canvas, 7); break;
                case 8: renderScreen8(canvas); break;
                case 9: renderScreen9(canvas); break;
                case 10: renderScreen10(canvas); break;
                case 11: renderScreen11(canvas); break;
                case 12: renderScreen12(canvas); break;
                case 13: renderScreen13(canvas); break;
            }
        }

        function renderScreen1(canvas) {
            speakText("Welcome to Language Detectives. The Missing Sound Clues. Every sound tells a story. Can you find the pattern?");
            
            canvas.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center my-auto py-6 space-y-6">
                    <div class="relative">
                        <div class="w-24 h-24 md:w-32 md:h-32 bg-gold/10 border-2 border-gold rounded-full flex items-center justify-center text-gold text-4xl md:text-5xl shadow-lg pulse-gold">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <div class="absolute -bottom-2 -right-2 bg-gold text-navy w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold">
                            <i class="fa-solid fa-search"></i>
                        </div>
                    </div>

                    <div class="space-y-3 max-w-xl">
                        <span class="inline-block bg-gold/20 text-gold font-bold text-xs uppercase tracking-wider px-3 py-1 rounded-full border border-gold/30">
                            Grade 9 English Mission
                        </span>
                        <h2 class="text-2xl md:text-4xl font-extrabold text-ivory tracking-tight">THE MISSING SOUND CLUES</h2>
                        <p class="text-base md:text-lg text-ivory/90 font-medium">Every sound tells a story. Can you find the pattern?</p>
                        <p class="text-sm text-ivory/70 leading-relaxed">
                            Four sound devices are hiding in the literary lines. Identify the clues, collect evidence, and solve the case.
                        </p>
                    </div>

                    <button onclick="navigateTo(2)" class="mt-4 bg-gold hover:bg-gold-light text-navy font-extrabold text-base px-8 py-3.5 rounded-xl shadow-lg hover:shadow-gold/20 transition transform hover:-translate-y-0.5 flex items-center gap-3">
                        <span>START INVESTIGATION</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            `;
        }

        function renderScreen2(canvas) {
            speakText("Your Detective Briefing. Your mission is to investigate four sound devices.");

            canvas.innerHTML = `
                <div class="space-y-6">
                    <div class="border-b border-gold/20 pb-4">
                        <span class="text-gold text-xs font-bold uppercase tracking-widest">Screen 02</span>
                        <h2 class="text-xl md:text-2xl font-bold text-ivory">Your Detective Briefing</h2>
                        <p class="text-sm text-ivory/80 mt-1">Your mission is to investigate four sound devices across literary clues.</p>
                    </div>

                    <!-- 4 Concept Cards Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-navy-light/80 p-4 rounded-xl border border-gold/20 hover:border-gold/50 transition">
                            <div class="flex items-center gap-2 mb-2 text-gold font-bold">
                                <i class="fa-solid fa-music"></i>
                                <span>Rhyme</span>
                            </div>
                            <p class="text-xs text-ivory/80">Matching or similar ending sounds in nearby words.</p>
                        </div>

                        <div class="bg-navy-light/80 p-4 rounded-xl border border-gold/20 hover:border-gold/50 transition">
                            <div class="flex items-center gap-2 mb-2 text-gold font-bold">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Repetition</span>
                            </div>
                            <p class="text-xs text-ivory/80">A word, phrase, line, or pattern used again for emphasis.</p>
                        </div>

                        <div class="bg-navy-light/80 p-4 rounded-xl border border-gold/20 hover:border-gold/50 transition">
                            <div class="flex items-center gap-2 mb-2 text-gold font-bold">
                                <i class="fa-solid fa-font"></i>
                                <span>Alliteration</span>
                            </div>
                            <p class="text-xs text-ivory/80">Repeated initial consonant sounds in nearby words.</p>
                        </div>

                        <div class="bg-navy-light/80 p-4 rounded-xl border border-gold/20 hover:border-gold/50 transition">
                            <div class="flex items-center gap-2 mb-2 text-gold font-bold">
                                <i class="fa-solid fa-[#]"></i>
                                <span>Anaphora</span>
                            </div>
                            <p class="text-xs text-ivory/80">Repeated words or phrases at the beginnings of successive lines.</p>
                        </div>
                    </div>

                    <!-- Explanation & Rules Box -->
                    <div class="bg-navy p-4 rounded-xl border border-slate/30 text-xs text-ivory/80 space-y-2">
                        <p class="text-ivory font-semibold"><i class="fa-solid fa-circle-info text-gold mr-1"></i> Why Sound Devices Matter:</p>
                        <p>Sound patterns create rhythm, emphasize key ideas, and influence how readers experience a poem's emotion and meaning.</p>
                        <p class="text-gold/90 font-medium pt-1"><strong>How to play:</strong> Study each clue file, answer the checkpoints, collect up to 150 points, and solve the final case poem!</p>
                    </div>

                    <!-- Footer Controls -->
                    <div class="flex justify-between items-center pt-2">
                        <button onclick="navigateTo(1)" class="text-xs text-ivory/70 hover:text-ivory px-3 py-2">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Back
                        </button>
                        <button onclick="navigateTo(3)" class="bg-gold hover:bg-gold-light text-navy font-bold text-sm px-6 py-2.5 rounded-lg transition flex items-center gap-2">
                            <span>I'M READY</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderScreen3(canvas) {
            speakText("Warm-up: Listen for the Pattern. Read these words aloud: rain, train, plain. What do you notice?");

            canvas.innerHTML = `
                <div class="space-y-6">
                    <div class="border-b border-gold/20 pb-3 flex justify-between items-center">
                        <div>
                            <span class="text-gold text-xs font-bold uppercase tracking-widest">Screen 03 • Warm-up</span>
                            <h2 class="text-xl font-bold text-ivory">Listen for the Pattern</h2>
                        </div>
                        <span class="bg-slate/40 text-xs px-2.5 py-1 rounded-full text-ivory/70 border border-slate/30">Unscored Activity</span>
                    </div>

                    <!-- Prompt Box -->
                    <div class="bg-navy p-5 rounded-xl border border-gold/30 text-center space-y-2">
                        <p class="text-xs text-gold font-semibold uppercase">Read these words aloud:</p>
                        <p class="text-2xl font-bold text-ivory tracking-wide">"rain — train — plain"</p>
                        <p class="text-sm text-ivory/80 pt-1">What do you notice about these words?</p>
                    </div>

                    <!-- Choices Grid -->
                    <div class="space-y-2.5" id="warmup-choices">
                        <button onclick="checkWarmup('A')" class="w-full text-left p-3.5 bg-navy-light/80 hover:bg-navy-light rounded-xl border border-gold/10 hover:border-gold/40 text-sm transition flex items-center gap-3">
                            <span class="w-7 h-7 rounded-lg bg-navy flex items-center justify-center font-bold text-gold text-xs border border-gold/30">A</span>
                            <span>They repeat the exact same word.</span>
                        </button>
                        <button onclick="checkWarmup('B')" class="w-full text-left p-3.5 bg-navy-light/80 hover:bg-navy-light rounded-xl border border-gold/10 hover:border-gold/40 text-sm transition flex items-center gap-3">
                            <span class="w-7 h-7 rounded-lg bg-navy flex items-center justify-center font-bold text-gold text-xs border border-gold/30">B</span>
                            <span>They have similar ending sounds.</span>
                        </button>
                        <button onclick="checkWarmup('C')" class="w-full text-left p-3.5 bg-navy-light/80 hover:bg-navy-light rounded-xl border border-gold/10 hover:border-gold/40 text-sm transition flex items-center gap-3">
                            <span class="w-7 h-7 rounded-lg bg-navy flex items-center justify-center font-bold text-gold text-xs border border-gold/30">C</span>
                            <span>They begin with the same consonant sound.</span>
                        </button>
                        <button onclick="checkWarmup('D')" class="w-full text-left p-3.5 bg-navy-light/80 hover:bg-navy-light rounded-xl border border-gold/10 hover:border-gold/40 text-sm transition flex items-center gap-3">
                            <span class="w-7 h-7 rounded-lg bg-navy flex items-center justify-center font-bold text-gold text-xs border border-gold/30">D</span>
                            <span>They repeat the same phrase at the beginning of successive lines.</span>
                        </button>
                    </div>

                    <!-- Feedback Container -->
                    <div id="warmup-feedback" class="hidden p-4 rounded-xl text-sm border"></div>

                    <!-- Footer Controls -->
                    <div class="flex justify-between items-center pt-2">
                        <button onclick="navigateTo(2)" class="text-xs text-ivory/70 hover:text-ivory px-3 py-2">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Back
                        </button>
                        <button id="warmup-next-btn" onclick="navigateTo(4)" class="hidden bg-gold hover:bg-gold-light text-navy font-bold text-sm px-6 py-2.5 rounded-lg transition flex items-center gap-2">
                            <span>CONTINUE TO CLUE 01</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function checkWarmup(choice) {
            const feedback = document.getElementById('warmup-feedback');
            const nextBtn = document.getElementById('warmup-next-btn');
            feedback.classList.remove('hidden');

            if (choice === 'B') {
                feedback.className = "p-4 rounded-xl text-sm border border-green-500/30 bg-green-900/20 text-green-200";
                feedback.innerHTML = `
                    <div class="font-bold flex items-center gap-2 mb-1">
                        <i class="fa-solid fa-circle-check text-green-400"></i> Correct!
                    </div>
                    <p>Rain, train, and plain share similar ending sounds (/ain/). That sound pattern is a clue for <strong>rhyme</strong>.</p>
                `;
                speakText("Correct. Rain, train, and plain share similar ending sounds. That is a clue for rhyme.");
                nextBtn.classList.remove('hidden');
            } else {
                feedback.className = "p-4 rounded-xl text-sm border border-amber-500/30 bg-amber-900/20 text-amber-200";
                feedback.innerHTML = `
                    <div class="font-bold flex items-center gap-2 mb-1">
                        <i class="fa-solid fa-circle-exclamation text-amber-400"></i> Not quite.
                    </div>
                    <p>Read the three words aloud again: <em>rain, train, plain</em>. Listen to how their ending sounds compare.</p>
                `;
                speakText("Not quite. Read the three words aloud. Listen to how their ending sounds compare.");
            }
        }

        const conceptData = {
            4: {
                title: "Clue File 01 — Rhyme",
                badgeKey: "rhyme",
                badgeTitle: "Rhyme Ranger",
                def: "Rhyme occurs when words share matching or similar ending sounds. It can appear at the ends of lines (end rhyme) or within a line (internal rhyme). Focus mainly on end rhyme.",
                evidenceText: "Stars shine in the night,\nEverything glows so bright.",
                evidenceHighlights: "night / bright",
                steps: [
                    "1. Read the words aloud.",
                    "2. Compare their ending sounds.",
                    "3. Check whether the sounds match or are similar."
                ],
                tip: "The first sounds of <em>night</em> and <em>bright</em> differ, but their ending sounds match. Words do not have to be spelled identically to rhyme; focus on pronunciation.",
                checkpoint: {
                    question: "Which pair of words rhymes?",
                    choices: [
                        { id: 'A', text: "sun — moon" },
                        { id: 'B', text: "light — bright" },
                        { id: 'C', text: "rain — cloud" },
                        { id: 'D', text: "tree — leaf" }
                    ],
                    correct: 'B',
                    hint: "Compare the sounds at the ends of the two words.",
                    correctFeedback: "Case clue found! Light and bright share the same ending sound (/ait/). Matching sound identifies the rhyme.",
                    incorrectFeedback: "Look for words whose ending sounds match when spoken. Try reading each pair aloud."
                }
            },
            5: {
                title: "Clue File 02 — Repetition",
                badgeKey: "repetition",
                badgeTitle: "Repetition Tracker",
                def: "Repetition is the deliberate reuse of a word, phrase, line, or pattern. Writers use it to emphasize an idea, strengthen rhythm, or make an expression memorable.",
                evidenceText: "“Run, run, run until you reach the finish line.”",
                evidenceHighlights: "The word 'run' appears three times.",
                steps: [
                    "1. Look for a word or phrase that appears more than once.",
                    "2. Identify exactly what is repeated.",
                    "3. Consider what the repeated expression emphasizes."
                ],
                tip: "Repetition is the broader category. Anaphora is a specific kind of repetition based on where the repeated words appear.",
                checkpoint: {
                    question: "In 'The bell rang, rang, rang across the hall,' which clue shows repetition?",
                    choices: [
                        { id: 'A', text: "The word rang appears three times." },
                        { id: 'B', text: "The words have matching ending sounds." },
                        { id: 'C', text: "Several nearby words begin with the same consonant sound." },
                        { id: 'D', text: "Several clauses begin with the same phrase." }
                    ],
                    correct: 'A',
                    hint: "Check whether one word appears more than once.",
                    correctFeedback: "Correct! The word rang is deliberately repeated to draw attention to the bell's continued ringing.",
                    incorrectFeedback: "Look for the feature that actually occurs in the sentence. Which word appears again and again?"
                }
            },
            6: {
                title: "Clue File 03 — Alliteration",
                badgeKey: "alliteration",

        function submitConceptAnswer(screenNum, choice) {
            const data = conceptData[screenNum];
            const cpState = state.checkpoints[screenNum];
            if (cpState.completed) return;

            cpState.attempt++;
            cpState.choice = choice;

            const isCorrect = (choice === data.checkpoint.correct);

            if (isCorrect) {
                cpState.completed = true;
                const points = (cpState.attempt === 1) ? 10 : 5;
                cpState.scoreEarned = points;
                updateScore(points, cpState.attempt === 1);
                
                // Award Badge
                state.badges[data.badgeKey] = true;
                
                speakText("Correct! " + data.checkpoint.correctFeedback);
                renderConceptFeedbackUI(screenNum, true, choice);
            } else {
                if (cpState.attempt === 1) {
                    showConceptHint(screenNum);
                    speakText("Not quite. " + data.checkpoint.incorrectFeedback);
                    renderConceptFeedbackUI(screenNum, false, choice, true);
                } else {
                    cpState.completed = true;
                    cpState.scoreEarned = 0;
                    speakText("Incorrect attempt limit reached. " + data.checkpoint.incorrectFeedback);
                    renderConceptFeedbackUI(screenNum, false, choice, false);

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-navy p-4 rounded-xl border border-gold/30 text-center space-y-1">
                            <span class="text-xs text-ivory/70 font-semibold uppercase">Total Investigation Score</span>
                            <p class="text-3xl font-extrabold text-gold">${state.score} <span class="text-base text-ivory/60 font-normal">/ 150</span></p>
                        </div>
                        <div class="bg-navy p-4 rounded-xl border border-gold/30 text-center space-y-1">
                            <span class="text-xs text-ivory/70 font-semibold uppercase">First-Attempt Correct</span>
                            <p class="text-3xl font-extrabold text-ivory">${firstAttemptCount} <span class="text-base text-ivory/60 font-normal">/ 15 items</span></p>
                        </div>
                    </div>

                    <!-- Badge Cabinet -->
                    <div class="bg-navy-light/60 p-5 rounded-2xl border border-gold/20 space-y-3">
                        <h3 class="text-xs font-bold text-gold uppercase tracking-wider text-center">Detective Badge Cabinet</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            ${renderBadgeCard('Rhyme Ranger', state.badges.rhyme, 'fa-music', 'Checkpoint 1')}
                            ${renderBadgeCard('Repetition Tracker', state.badges.repetition, 'fa-rotate-right', 'Checkpoint 2')}
                            ${renderBadgeCard('Alliteration Alert', state.badges.alliteration, 'fa-font', 'Checkpoint 3')}
                            ${renderBadgeCard('Anaphora Analyst', state.badges.anaphora, 'fa-[#]', 'Checkpoint 4')}
                            ${renderBadgeCard('Sound Sleuth', state.badges.sleuth, 'fa-user-ninja', 'Complete Mission')}
                            ${renderBadgeCard('Sound Pattern Master', state.badges.master, 'fa-crown', '120+ Points')}
                        </div>
                    </div>

                    <!-- Final Control Buttons -->
                    <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
                        <button onclick="reviewMissedQuestions()" class="bg-navy-light hover:bg-slate border border-gold/30 text-gold text-xs font-bold px-5 py-3 rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>REVIEW MISSED QUESTIONS</span>
                        </button>

                        <button onclick="replayMission()" class="bg-navy-light hover:bg-slate border border-gold/30 text-ivory text-xs font-bold px-5 py-3 rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-redo"></i>
                            <span>REPLAY MISSION</span>
                        </button>

                        <button onclick="alert('Mission 2: Meaning Quest unlocked in full curriculum suite!')" class="bg-gold hover:bg-gold-light text-navy font-extrabold text-xs px-6 py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                            <span>CONTINUE TO MISSION 2</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderBadgeCard(name, earned, iconClass, condition) {
            return `
                <div class="${earned ? 'bg-navy border-gold/50 text-ivory' : 'bg-navy/40 border-slate/20 text-ivory/40 badge-locked'} p-3 rounded-xl border flex flex-col items-center text-center space-y-1 transition">
                    <div class="${earned ? 'bg-gold text-navy' : 'bg-slate/30 text-ivory/30'} w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">
                        <i class="fa-solid ${iconClass}"></i>
                    </div>
                    <span class="text-xs font-bold leading-tight">${name}</span>
                    <span class="text-[10px] ${earned ? 'text-gold' : 'text-ivory/40'}">${earned ? 'Earned' : condition}</span>
                </div>
            `;
        }

        function getFirstAttemptCorrectCount() {
            let count = 0;
            // Checkpoints
            [4, 5, 6, 7].forEach(s => {
                if (state.checkpoints[s].scoreEarned === 10) count++;
            });
            // Challenge
            state.challenge.items.forEach(i => {
                if (i.scoreEarned === 10) count++;
            });
            // Final Case
            state.finalCase.tasks.forEach(t => {
                if (t.scoreEarned === 10) count++;
            });
            return count;
        }

        function reviewMissedQuestions() {
            // Reopen mixed challenge for review
            state.challenge.currentIndex = 0;
            navigateTo(9);
        }

        function replayMission() {
            // Reset state
            state.score = 0;
            state.firstAttemptScore = 0;
            state.conceptRevealStage = { 4: 1, 5: 1, 6: 1, 7: 1 };
            state.checkpoints = {
                4: { completed: false, attempt: 0, scoreEarned: 0, choice: null },
                5: { completed: false, attempt: 0, scoreEarned: 0, choice: null },
                6: { completed: false, attempt: 0, scoreEarned: 0, choice: null },
                7: { completed: false, attempt: 0, scoreEarned: 0, choice: null }
            };
            state.challenge = {
                currentIndex: 0,
                items: Array.from({length: 6}, (_, i) => ({ id: i + 1, completed: false, attempt: 0, scoreEarned: 0, userChoice: null }))
            };
            state.finalCase = {
                currentIndex: 0,
                tasks: [
                    { id: 1, type: 'highlight_pair', completed: false, attempt: 0, scoreEarned: 0, selected: [] },
                    { id: 2, type: 'drag_tap', completed: false, attempt: 0, scoreEarned: 0, value: null },
                    { id: 3, type: 'highlight_line', completed: false, attempt: 0, scoreEarned: 0, selectedIndex: null },
                    { id: 4, type: 'highlight_phrase', completed: false, attempt: 0, scoreEarned: 0, selectedIndex: null },
                    { id: 5, type: 'select_effect', completed: false, attempt: 0, scoreEarned: 0, choice: null }
                ]
            };
            state.badges = { rhyme: false, repetition: false, alliteration: false, anaphora: false, sleuth: false, master: false };
            
            document.getElementById('current-score').innerText = '0';
            navigateTo(1);
        }

        window.onload = function() {
            renderScreen();
        };
    </script>
</body>
</html>
